name: "skillmd-lint"
description: "Lint and validate SKILL.md files against the open SKILL.md spec. CI-friendly, offline, no API key."
author: "Mine-FNL"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  path:
    description: "Path(s) to lint — a SKILL.md file, a skill folder, or a folder containing skills/. Default: 'skills/'."
    required: false
    default: "skills/"
  strict:
    description: "Treat warnings as errors (sets exit code 1 on any warning)."
    required: false
    default: "false"
  fail-on-warnings:
    description: "Alias for `strict`. If either is `true`, warnings become errors."
    required: false
    default: "false"
  version:
    description: "skillmd-lint version to install (e.g. '1.4.0'). Pin this in production to keep CI reproducible."
    required: false
    default: "1.4.0"
  extra-args:
    description: "Extra args to pass through to skillmd-lint (e.g. '--format github --schema')."
    required: false
    default: ""
  index-url:
    description: "PEP 503 index URL for pip install. Defaults to PyPI. Set this to the GitHub Pages index for an offline-friendly install path."
    required: false
    default: ""

outputs:
  errors:
    description: "Number of error-level findings."
    value: ${{ steps.lint.outputs.errors }}
  warnings:
    description: "Number of warning-level findings."
    value: ${{ steps.lint.outputs.warnings }}

runs:
  using: "docker"
  image: "Dockerfile"

  args:
    - --path=${{ inputs.path }}
    - --strict-input=${{ inputs.strict }}
    - --fail-on-warnings-input=${{ inputs.fail-on-warnings }}
    - --version-input=${{ inputs.version }}
    - --extra-args-input=${{ inputs.extra-args }}
    - --index-url-input=${{ inputs.index-url }}