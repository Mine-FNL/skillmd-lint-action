name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  action:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [valid, warnings, invalid]
    steps:
      - uses: actions/checkout@v4

      - name: Run action against ${{ matrix.fixture }} fixture
        id: lint
        continue-on-error: ${{ matrix.fixture == 'invalid' }}
        uses: ./
        with:
          path: tests/fixtures/${{ matrix.fixture }}/SKILL.md
          version: "1.4.0"

      - name: Assert action outputs
        run: |
          if [[ "${{ matrix.fixture }}" == "valid" ]]; then
            [[ "${{ steps.lint.outputs.errors }}" == "0" ]]
          elif [[ "${{ matrix.fixture }}" == "warnings" ]]; then
            [[ "${{ steps.lint.outputs.errors }}" == "0" ]]
            [[ "${{ steps.lint.outputs.warnings }}" -gt "0" ]]
          elif [[ "${{ matrix.fixture }}" == "invalid" ]]; then
            [[ "${{ steps.lint.outputs.errors }}" -gt "0" ]]
          fi