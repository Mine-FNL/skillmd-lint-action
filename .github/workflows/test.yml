name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  action:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [valid, warnings, invalid]
    steps:
      - uses: actions/checkout@v4

      - name: Run action against ${{ matrix.fixture }} fixture
        id: lint
        continue-on-error: ${{ matrix.fixture == 'invalid' }}
        uses: ./
        with:
          path: tests/fixtures/${{ matrix.fixture }}/SKILL.md
          version: "1.4.0"

      - name: Assert action outputs
        env:
          ERRORS: ${{ steps.lint.outputs.errors }}
          WARNINGS: ${{ steps.lint.outputs.warnings }}
        run: |
          fixture="${{ matrix.fixture }}"
          if [[ "$fixture" == "valid" ]]; then
            [[ "$ERRORS" == "0" ]]
          elif [[ "$fixture" == "warnings" ]]; then
            [[ "$ERRORS" == "0" ]]
            [[ "$WARNINGS" =~ ^[0-9]+$ && "$WARNINGS" -gt 0 ]]
          elif [[ "$fixture" == "invalid" ]]; then
            [[ "$ERRORS" =~ ^[0-9]+$ && "$ERRORS" -gt 0 ]]
          fi